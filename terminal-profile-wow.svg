<svg width="1200" height="540" viewBox="0 0 1200 540" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="540" gradientUnits="userSpaceOnUse">
      <stop stop-color="#030712"/>
      <stop offset="0.48" stop-color="#08111F"/>
      <stop offset="1" stop-color="#0C1224"/>
    </linearGradient>

    <linearGradient id="hero" x1="120" y1="210" x2="480" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9">
        <animate attributeName="stop-color" values="#67E8F9;#A78BFA;#22D3EE;#67E8F9" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#818CF8">
        <animate attributeName="stop-color" values="#818CF8;#22D3EE;#C084FC;#818CF8" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#C084FC">
        <animate attributeName="stop-color" values="#C084FC;#F472B6;#818CF8;#C084FC" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#67E8F9" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="wave" x1="35" y1="0" x2="1165" y2="0">
      <stop stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#22D3EE"/>
      <stop offset="0.7" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#F472B6" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE;#A855F7;#F472B6;#22D3EE" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#6366F1">
        <animate attributeName="stop-color" values="#6366F1;#22D3EE;#A855F7;#6366F1" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#A855F7">
        <animate attributeName="stop-color" values="#A855F7;#F472B6;#22D3EE;#A855F7" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="halo">
      <stop stop-color="#22D3EE" stop-opacity="0.2"/>
      <stop offset="0.55" stop-color="#6366F1" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#334155" stroke-width="0.55" opacity="0.22"/>
    </pattern>

    <filter id="cyanGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feFlood flood-color="#22D3EE" flood-opacity="0.7"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="purpleGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feFlood flood-color="#A855F7" flood-opacity="0.65"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="inside">
      <rect x="16" y="16" width="1168" height="508" rx="25"/>
    </clipPath>

    <clipPath id="reveal1"><rect x="735" y="164" width="0" height="25"><animate attributeName="width" values="0;385;385" keyTimes="0;0.35;1" begin="0.2s" dur="5s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="reveal2"><rect x="735" y="202" width="0" height="25"><animate attributeName="width" values="0;385;385" keyTimes="0;0.35;1" begin="0.55s" dur="5s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="reveal3"><rect x="735" y="240" width="0" height="25"><animate attributeName="width" values="0;385;385" keyTimes="0;0.35;1" begin="0.9s" dur="5s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="reveal4"><rect x="735" y="278" width="0" height="25"><animate attributeName="width" values="0;385;385" keyTimes="0;0.35;1" begin="1.25s" dur="5s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="reveal5"><rect x="735" y="316" width="0" height="25"><animate attributeName="width" values="0;385;385" keyTimes="0;0.35;1" begin="1.6s" dur="5s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="reveal6"><rect x="735" y="354" width="0" height="25"><animate attributeName="width" values="0;385;385" keyTimes="0;0.35;1" begin="1.95s" dur="5s" repeatCount="indefinite"/></rect></clipPath>

    <style>
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .label { fill:#64748B; font-size:13px; font-weight:700; letter-spacing:1.6px; }
      .value { fill:#D8E6F7; font-size:14px; font-weight:600; }
      .rain { fill:#22D3EE; font-size:10px; opacity:.15; letter-spacing:2px; }
      .dash { stroke-dasharray:20 16; animation:dash 8s linear infinite; }
      .blink { animation:blink 1s steps(2,end) infinite; }
      .flicker { animation:flicker 4s linear infinite; }
      @keyframes dash { to { stroke-dashoffset:-144; } }
      @keyframes blink { 50% { opacity:0; } }
      @keyframes flicker { 0%,18%,22%,62%,64%,100%{opacity:1} 20%,63%{opacity:.5} }
    </style>
  </defs>

  <rect width="1200" height="540" rx="28" fill="url(#bg)"/>
  <rect x="2" y="2" width="1196" height="536" rx="26" stroke="url(#border)" stroke-width="4"/>

  <g clip-path="url(#inside)">
    <rect x="16" y="16" width="1168" height="508" fill="url(#grid)"/>
    <ellipse cx="310" cy="280" rx="300" ry="270" fill="url(#halo)">
      <animate attributeName="opacity" values=".55;1;.55" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="1130" cy="75" r="180" fill="#7C3AED" opacity=".055"/>
    <circle cx="1010" cy="520" r="220" fill="#0891B2" opacity=".04"/>

    <!-- Matrix rain -->
    <g class="mono rain">
      <text x="42" y="-30">10110100101101001011010100101101<animateTransform attributeName="transform" type="translate" values="0 -80;0 700" dur="10s" repeatCount="indefinite"/></text>
      <text x="118" y="-90">01101011001010110100110101101001<animateTransform attributeName="transform" type="translate" values="0 -120;0 720" dur="13s" begin="-5s" repeatCount="indefinite"/></text>
      <text x="205" y="-45">11001010110100101101011001010110<animateTransform attributeName="transform" type="translate" values="0 -100;0 690" dur="11s" begin="-8s" repeatCount="indefinite"/></text>
      <text x="434" y="-80">00110101100101011010010110100101<animateTransform attributeName="transform" type="translate" values="0 -100;0 720" dur="15s" begin="-3s" repeatCount="indefinite"/></text>
      <text x="528" y="-40">10100101101001011010011010110010<animateTransform attributeName="transform" type="translate" values="0 -80;0 690" dur="12s" begin="-7s" repeatCount="indefinite"/></text>
      <text x="1124" y="-100">01011010010110100101101001011010<animateTransform attributeName="transform" type="translate" values="0 -100;0 720" dur="14s" begin="-6s" repeatCount="indefinite"/></text>
    </g>

    <!-- Floating particles -->
    <g fill="#67E8F9">
      <circle cx="80" cy="460" r="1.8" opacity=".5"><animate attributeName="cy" values="500;80" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.7;0" dur="8s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="430" r="1.4" opacity=".4"><animate attributeName="cy" values="510;120" dur="10s" begin="-4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.6;0" dur="10s" begin="-4s" repeatCount="indefinite"/></circle>
      <circle cx="1080" cy="470" r="1.6" opacity=".5"><animate attributeName="cy" values="500;110" dur="9s" begin="-6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="9s" begin="-6s" repeatCount="indefinite"/></circle>
      <circle cx="890" cy="450" r="1.3" opacity=".4"><animate attributeName="cy" values="520;100" dur="12s" begin="-2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.55;0" dur="12s" begin="-2s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- Window chrome -->
  <circle cx="48" cy="45" r="6" fill="#FF5F56"/>
  <circle cx="69" cy="45" r="6" fill="#FFBD2E"/>
  <circle cx="90" cy="45" r="6" fill="#27C93F"/>
  <text x="600" y="50" text-anchor="middle" class="mono" fill="#64748B" font-size="12">BURAK_OS // DEVELOPER INTERFACE v9.0</text>
  <g transform="translate(1060 35)">
    <circle cx="0" cy="10" r="4" fill="#22C55E" filter="url(#softGlow)">
      <animate attributeName="r" values="3;5;3" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="14" y="14" class="mono" fill="#86EFAC" font-size="11">SYSTEM ONLINE</text>
  </g>
  <line x1="32" y1="70" x2="1168" y2="70" stroke="#263246"/>

  <!-- Left hologram -->
  <text x="55" y="105" class="mono" fill="#64748B" font-size="13">$ initialize identity --mode holographic</text>
  <text x="55" y="137" class="mono" fill="#E2E8F0" font-size="16" font-weight="700" letter-spacing="2">BURAK HAN ULUSOY</text>
  <text x="55" y="159" class="mono" fill="#22D3EE" font-size="12" letter-spacing="2.2">.NET BACKEND DEVELOPER // AI SYSTEMS</text>

  <g transform="translate(300 305)">
    <!-- rotating HUD rings -->
    <circle r="155" stroke="#22D3EE" stroke-width="1" opacity=".24" stroke-dasharray="5 11">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
    </circle>
    <circle r="131" stroke="#A78BFA" stroke-width="1.4" opacity=".28" stroke-dasharray="30 14 4 14">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle r="104" stroke="#38BDF8" stroke-width="1" opacity=".2" stroke-dasharray="2 8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
    </circle>

    <!-- orbiting tech nodes -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/>
      <g transform="translate(0 -155)">
        <rect x="-26" y="-12" width="52" height="24" rx="12" fill="#071522" stroke="#22D3EE"/>
        <text text-anchor="middle" y="4" class="mono" fill="#67E8F9" font-size="10">.NET</text>
      </g>
      <g transform="translate(155 0)">
        <rect x="-25" y="-12" width="50" height="24" rx="12" fill="#111026" stroke="#A78BFA"/>
        <text text-anchor="middle" y="4" class="mono" fill="#C4B5FD" font-size="10">AI</text>
      </g>
      <g transform="translate(0 155)">
        <rect x="-28" y="-12" width="56" height="24" rx="12" fill="#071522" stroke="#38BDF8"/>
        <text text-anchor="middle" y="4" class="mono" fill="#7DD3FC" font-size="10">DATA</text>
      </g>
      <g transform="translate(-155 0)">
        <rect x="-26" y="-12" width="52" height="24" rx="12" fill="#151024" stroke="#F472B6"/>
        <text text-anchor="middle" y="4" class="mono" fill="#F9A8D4" font-size="10">API</text>
      </g>
    </g>

    <!-- main floating/glitch BHU -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="-9 0;12 -7;-4 4;9 -3;-9 0" dur="6s" repeatCount="indefinite"/>
      <text x="-3" y="29" text-anchor="middle" class="mono flicker" fill="#F472B6" opacity=".28" font-size="104" font-weight="900" letter-spacing="-8">BHU</text>
      <text x="4" y="25" text-anchor="middle" class="mono flicker" fill="#22D3EE" opacity=".3" font-size="104" font-weight="900" letter-spacing="-8">BHU</text>
      <text y="27" text-anchor="middle" class="mono" fill="url(#hero)" filter="url(#cyanGlow)" font-size="104" font-weight="900" letter-spacing="-8">BHU
        <animate attributeName="opacity" values=".78;1;.86;1;.78" dur="2.8s" repeatCount="indefinite"/>
      </text>
    </g>

    <text y="64" text-anchor="middle" class="mono" fill="#94A3B8" font-size="11" letter-spacing="3">BUILD // SCALE // INTEGRATE</text>

    <!-- hologram scanner -->
    <rect x="-112" y="-62" width="224" height="2" rx="1" fill="url(#scan)" filter="url(#cyanGlow)">
      <animate attributeName="y" values="-62;72;-62" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.95;0" dur="3.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Separator -->
  <line x1="555" y1="96" x2="555" y2="447" stroke="#263246"/>
  <circle cx="555" cy="124" r="3" fill="#22D3EE"><animate attributeName="cy" values="112;435;112" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/></circle>

  <!-- Right terminal -->
  <rect x="585" y="96" width="560" height="351" rx="17" fill="#07101C" fill-opacity=".72" stroke="#263246"/>
  <rect x="585" y="96" width="560" height="38" rx="17" fill="#101827"/>
  <rect x="585" y="118" width="560" height="16" fill="#101827"/>
  <text x="606" y="120" class="mono" fill="#64748B" font-size="12">developer@github</text>
  <text x="1118" y="120" text-anchor="end" class="mono blink" fill="#22D3EE" font-size="12">● LIVE</text>

  <text x="608" y="174" class="mono label">RUNTIME</text>
  <g clip-path="url(#reveal1)"><text x="735" y="174" class="mono value">.NET 8 / .NET 9 · C#</text></g>

  <text x="608" y="212" class="mono label">BACKEND</text>
  <g clip-path="url(#reveal2)"><text x="735" y="212" class="mono value">ASP.NET CORE · WEB API · MVC</text></g>

  <text x="608" y="250" class="mono label">PATTERNS</text>
  <g clip-path="url(#reveal3)"><text x="735" y="250" class="mono value">CQRS · MEDIATR · UOW · REPOSITORY</text></g>

  <text x="608" y="288" class="mono label">DATA</text>
  <g clip-path="url(#reveal4)"><text x="735" y="288" class="mono value">DAPPER · EF CORE · SQL · NOSQL</text></g>

  <text x="608" y="326" class="mono label">AI LAYER</text>
  <g clip-path="url(#reveal5)"><text x="735" y="326" class="mono value">OPENAI · GEMINI · CLAUDE · ML.NET</text></g>

  <text x="608" y="364" class="mono label">MISSION</text>
  <g clip-path="url(#reveal6)"><text x="735" y="364" class="mono" fill="#67E8F9" font-size="14" font-weight="700">BUILD SYSTEMS THAT CREATE VALUE_</text></g>

  <!-- animated telemetry -->
  <text x="608" y="405" class="mono" fill="#475569" font-size="10" letter-spacing="1.5">TELEMETRY</text>
  <g fill="#22D3EE">
    <rect x="688" y="397" width="6" height="15" rx="3"><animate attributeName="y" values="397;389;397" dur="1s" repeatCount="indefinite"/><animate attributeName="height" values="15;23;15" dur="1s" repeatCount="indefinite"/></rect>
    <rect x="700" y="391" width="6" height="21" rx="3"><animate attributeName="y" values="391;402;391" dur="1.4s" repeatCount="indefinite"/><animate attributeName="height" values="21;10;21" dur="1.4s" repeatCount="indefinite"/></rect>
    <rect x="712" y="385" width="6" height="27" rx="3"><animate attributeName="y" values="385;396;385" dur=".8s" repeatCount="indefinite"/><animate attributeName="height" values="27;16;27" dur=".8s" repeatCount="indefinite"/></rect>
    <rect x="724" y="399" width="6" height="13" rx="3"><animate attributeName="y" values="399;382;399" dur="1.2s" repeatCount="indefinite"/><animate attributeName="height" values="13;30;13" dur="1.2s" repeatCount="indefinite"/></rect>
    <rect x="736" y="388" width="6" height="24" rx="3"><animate attributeName="y" values="388;400;388" dur="1.5s" repeatCount="indefinite"/><animate attributeName="height" values="24;12;24" dur="1.5s" repeatCount="indefinite"/></rect>
    <rect x="748" y="394" width="6" height="18" rx="3"><animate attributeName="y" values="394;384;394" dur=".9s" repeatCount="indefinite"/><animate attributeName="height" values="18;28;18" dur=".9s" repeatCount="indefinite"/></rect>
  </g>

  <g transform="translate(825 403)">
    <circle r="24" fill="none" stroke="#1E293B" stroke-width="5"/>
    <circle r="24" fill="none" stroke="#A855F7" stroke-width="5" stroke-linecap="round" stroke-dasharray="115 36" transform="rotate(-90)" filter="url(#purpleGlow)">
      <animateTransform attributeName="transform" type="rotate" values="-90;270" dur="8s" repeatCount="indefinite"/>
    </circle>
    <text text-anchor="middle" y="4" class="mono" fill="#E9D5FF" font-size="9">98%</text>
  </g>

  <text x="870" y="394" class="mono" fill="#64748B" font-size="10">ARCHITECTURE</text>
  <text x="870" y="413" class="mono" fill="#C4B5FD" font-size="12">STABLE / OPTIMIZED</text>

  <!-- Footer data stream -->
  <path d="M32 488 C95 488 103 463 147 488 C183 508 207 469 244 488 C281 507 314 450 355 488 C402 530 440 469 480 488 C523 509 546 469 590 488 C636 509 666 451 707 488 C750 526 788 469 829 488 C873 509 902 467 944 488 C990 510 1012 461 1058 488 C1096 510 1125 488 1168 488" stroke="url(#wave)" stroke-width="2" fill="none" class="dash" filter="url(#softGlow)"/>
  <text x="40" y="516" class="mono" fill="#475569" font-size="10">SIGNAL: STRONG</text>
  <text x="600" y="516" text-anchor="middle" class="mono" fill="#64748B" font-size="10">AI-INTEGRATED SYSTEMS · HIGH-VOLUME DATA · SECURE APIs</text>
  <text x="1160" y="516" text-anchor="end" class="mono" fill="#475569" font-size="10">ANKARA / TR</text>
