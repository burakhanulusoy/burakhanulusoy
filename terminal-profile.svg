      .value { fill: #DCE7F7; font-size: 15px; font-weight: 500; }
      .ascii { fill: #22D3EE; font-size: 16px; font-weight: 700; }
      .cursor { animation: blink 1s steps(2, start) infinite; }
      .pulse { animation: pulse 2.8s ease-in-out infinite; transform-origin: center; }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes pulse { 0%,100% { opacity: .65; } 50% { opacity: 1; } }
    </style>
  </defs>

